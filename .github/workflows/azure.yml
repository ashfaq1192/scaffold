name: Azure Python CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Caches pip dependencies for faster builds

      - name: Install dependencies
        run: |
          make install

      - name: Lint
        run: |
          make lint

      - name: Test
        run: |
          make test
