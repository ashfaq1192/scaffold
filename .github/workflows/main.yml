name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip" # Caches pip packages automatically based on requirements.txt

      - name: Install dependencies
        run: |
          make install

      - name: Lint code
        run: |
          make lint

      - name: Run tests
        run: |
          make test
